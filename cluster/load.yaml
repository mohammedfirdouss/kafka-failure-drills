# Steady traffic for the drills, plus a toolbox pod for running Kafka CLI tools.
# The producer uses acks=all and short timeouts so failures show up within seconds.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
spec:
  replicas: 1
  selector: { matchLabels: { app: producer } }
  template:
    metadata: { labels: { app: producer } }
    spec:
      containers:
        - name: producer
          image: quay.io/strimzi/kafka:1.3.1-kafka-4.3.2
          command: ["/bin/bash", "-c"]
          args:
            - >-
              bin/kafka-producer-perf-test.sh --topic orders
              --num-records 100000000 --record-size 200 --throughput 50
              --reporting-interval 10000
              --bootstrap-server drills-kafka-bootstrap:9092
              --command-property acks=all request.timeout.ms=5000
              delivery.timeout.ms=10000 linger.ms=5
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits: { memory: 384Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
spec:
  replicas: 1
  selector: { matchLabels: { app: consumer } }
  template:
    metadata: { labels: { app: consumer } }
    spec:
      containers:
        - name: consumer
          image: quay.io/strimzi/kafka:1.3.1-kafka-4.3.2
          command: ["/bin/bash", "-c"]
          args:
            - >-
              bin/kafka-console-consumer.sh --topic orders --group orders-app
              --bootstrap-server drills-kafka-bootstrap:9092 > /dev/null
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits: { memory: 384Mi }
---
apiVersion: v1
kind: Pod
metadata:
  name: toolbox
spec:
  containers:
    - name: toolbox
      image: quay.io/strimzi/kafka:1.3.1-kafka-4.3.2
      command: ["sleep", "infinity"]
      resources:
        requests: { memory: 256Mi, cpu: 50m }
        limits: { memory: 512Mi }
