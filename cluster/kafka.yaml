# One KRaft controller + three brokers.
# Controllers are kept separate from brokers so that killing brokers in the
# drills never takes down the metadata quorum.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: controller
  labels:
    strimzi.io/cluster: drills
spec:
  replicas: 1
  roles: [controller]
  storage:
    type: ephemeral
  resources:
    requests: { memory: 512Mi, cpu: 200m }
    limits: { memory: 768Mi }
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  labels:
    strimzi.io/cluster: drills
spec:
  replicas: 3
  roles: [broker]
  storage:
    type: ephemeral
  resources:
    requests: { memory: 768Mi, cpu: 250m }
    limits: { memory: 1Gi }
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: drills
spec:
  kafka:
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
  entityOperator:
    topicOperator: {}
---
# 3 partitions, every partition on all 3 brokers, and a write with acks=all
# needs at least 2 of them in sync.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: orders
  labels:
    strimzi.io/cluster: drills
spec:
  partitions: 3
  replicas: 3
  config:
    min.insync.replicas: 2
